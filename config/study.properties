# The study's lab database (compose.yaml) and its sizes. Every key is required.
db.url=jdbc:postgresql://127.0.0.1:21400/seatwave
# Module 13's owner role: it owns the study schema, so it may create and drop indexes.
db.user=seatwave_owner
# Written by scripts/stack.sh up, deleted by scripts/stack.sh down.
db.passwordFile=.secrets/owner.password
# The module's full volume is 2,500 arenas of 20,000 seats and 2,500 club nights of 200 seats,
# 50,500,000 seats. The study loads a quarter, 625 and 625: 12,625,000 seats, 15,000,000 holds,
# 10,000,000 bookings and 1,250,000 customers, every ratio of the full volume kept, because
# Docker's shared disk must keep 20 GB free (Section 8). 2,500 and 2,500 load the full volume.
study.arenaEvents=625
study.clubEvents=625
# 200 timed runs per query: enough for a p99 that is not just the slowest single run.
plan.repetitions=200
bench.seconds=60
# 64 writers. Each write waits about 1.3 ms (a 0.2 ms round trip and a 1 ms commit flush, Module
# 13's estimates), so by Little's Law 16 writers could never pass about 12,300 writes a second
# whatever the indexes: the run would measure the flush, not the indexes. 64 writers keep four
# cores busy; with one connection for set-up, 65 of the 200 connections compose.yaml allows.
bench.writerThreads=64
# Each benchmark table starts with 1,000,000 rows, so its indexes are not trivially small.
bench.prefillRows=1000000
